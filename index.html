<style>
/* Layout: full-bleed pixel canvas world, HUD pinned to the four corners, modal windows framed like engraved iron plates */
:root {
  --ink: #0e0c14; --panel: #17131f; --panel2: #211b2c; --line: #3a3048; --hi: #54476a;

  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--ink); color: var(--text); font-family: var(--f-body); font-size: 14px; }
#app { position: fixed; inset: 0; }
#ov { position: absolute; left: 0; top: 0; pointer-events: none; }
.zoom { display: flex; align-items: center; gap: 4px; margin-top: 5px; } .zoom button { flex: 1; background: var(--panel2); border: 2px solid var(--line); cursor: pointer; font: 700 15px var(--f-px); padding: 1px 0; } .zoom span { font: 11px var(--f-px); color: var(--muted); min-width: 40px; text-align: center; }
#cv { position: absolute; left: 0; top: 0; image-rendering: pixelated; image-rendering: crisp-edges; display: block; cursor: crosshair; touch-action: none; }
button { font-family: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--gold2); outline-offset: 1px; }
.muted { color: var(--muted); font-size: 12.5px; } .good { color: var(--good); } .bad { color: var(--red); }

/* tiers */
.tc.t1 { color: var(--t1) } .tc.t2 { color: var(--t2) } .tc.t3 { color: var(--t3) } .tc.t4 { color: var(--t4) } .tc.t5 { color: var(--t5) }
.tc.t6 { color: var(--t6) } .tc.t7 { color: var(--t7) } .tc.t8 { color: var(--t8) } .tc.t9 { color: var(--t9) } .tc.t10 { animation: hue 2.4s linear infinite; color: var(--t10) }

/* buttons */

.btn.dis, .chip.dis { opacity: .45; } .mini-btn { background: var(--panel2); border: 1px solid var(--line); padding: 3px 8px; font-size: 12px; cursor: pointer; margin: 2px; }

/* title */

.ccard.sel, .ccard:hover { border-color: var(--gold); background: #231a2a; }

/* HUD */
#hud { position: absolute; inset: 0; pointer-events: none; }
#hud > * { pointer-events: auto; }

.pname { font-family: var(--f-px); font-weight: 600; font-size: 15px; color: var(--gold2); } .plv { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { position: relative; height: 14px; background: #2a1a20; border: 1px solid #08060c; margin: 3px 0; overflow: hidden; }
.bar i { position: absolute; left: 0; top: 0; bottom: 0; transition: width .12s; } .bar span { position: absolute; inset: 0; font: 10px/14px var(--f-px); text-align: center; text-shadow: 1px 1px 0 #000; font-variant-numeric: tabular-nums; }

#hud-tc { position: absolute; left: 50%; transform: translateX(-50%); top: calc(10px + env(safe-area-inset-top, 0px)); text-align: center; background: rgba(14,12,20,.78); border: 2px solid var(--line); padding: 6px 14px; max-width: min(560px, 46vw); font-size: 13px; }
#hud-tc b { font-family: var(--f-px); font-weight: 600; color: var(--gold2); } #hud-tc small { font-size: 11.5px; }
.pvpz { color: var(--red); font-weight: 600; }

#mini { width: 100%; height: auto; image-rendering: pixelated; background: #0b0910; display: block; }

.skrow-wrap { display: flex; gap: 6px; align-items: flex-end; }
